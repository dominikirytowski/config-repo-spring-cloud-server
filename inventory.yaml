app: 
  name: Spring Product Inventory Service
server:
  port: 8082
  servlet:
    context-path: /inventory
    
application:
  product:
    catalog: 
      url: localhost:8083/catalog/product

logging: 
  level: 
    io:
      github: 
        resilience4j: DEBUG
      
resilience4j:
  retry:
    instances:
      productCatalogBySku:
        max-attempts: 5
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0

      productCatalogByUniq:
        max-attempts: 5
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
