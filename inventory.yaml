app: 
  name: Spring Product Inventory Service
server:
  port: 8082
  servlet:
    context-path: /inventory
    
application:
  product:
    catalog: 
      url: localhost:8083/catalog/product
      
resilience4j:
  retry:
    instances:
      productCatalogBySku:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0

      productCatalogByUniq:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        
  circuitbreaker:
    instances:
      inventory:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        
  timelimiter:
    instances:
      ProductCatalogServicegetProductsByUniqId:
        timeoutDuration: 3s

spring:
    cloud:
      openfeign:
        client:
          config:
            product:
              connectTimeout: 5000
              readTimeout: 10000
          default:
            loggerLevel: full
        circuitbreaker:
          enabled: true
