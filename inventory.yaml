app: 
  name: Spring Product Inventory Service
server:
  port: 8082
  servlet:
    context-path: /inventory
    
application:
  product:
    catalog: 
      url: localhost:8083/catalog/product
      
resilience4j.retry:
  instances:
    catalog:
      maxAttempts: 10
      waitDuration: 2000ms               
      exponentialBackoffMultiplier: 2.0 
      enableExponentialBackoff: true
