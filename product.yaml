app: 
  name: Spring Product Service
server:
  port: 8081
  servlet:
    context-path: /product
application:
  product:
    inventory: 
      url: localhost:8082/inventory/products

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
resilience4j:
  circuitbreaker:
    instances:
      product:
        minimumNumberOfCalls: 3
  timelimiter:
    instances:
      product:
        timeoutDuration: 10s
