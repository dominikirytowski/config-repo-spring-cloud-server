app: 
  name: Spring Product Service
server:
  port: 8081
  servlet:
    context-path: /product
application:
  product:
    inventory: 
      url: localhost:8082/inventory/products
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true
